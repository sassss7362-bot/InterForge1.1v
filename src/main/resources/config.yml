# Forge - налаштування

# Кастомне зачарування "Молот" (кірки, сокири, лопати).
# width - ширина (центр на блоці, який ламаєш), height - висота (1 блок нижче + решта вгору),
# depth - глибина вперед, у блок. Дивишся на підлогу/стелю - площина width x height, глибина вниз/вгору.
hammer:
  levels:
    1: { width: 3, height: 3, depth: 3 }
    2: { width: 10, height: 10, depth: 10 }
  max-blocks: 1500            # стеля блоків за один злам (захист сервера)
  durability-per-block: 0.1   # скільки міцності знімає кожен зламаний блок (0.1 = 10 блоків = 1 міцності)
  shape: cube                 # cube = паралелепіпед ширина x висота x глибина, sphere = еліпсоїд у цих межах
  ms-per-tick: 20             # скільки мс за тік можна витрачати на злам; решта області ламається в наступні тіки
  orient: face                # face = за гранню блока, на яку влучив промінь погляду (RayTrace), gaze = за домінантною віссю вектора погляду

# Кастомний TNT
tnt:
  max-power: 0                # 0 = сили вибуху ліміту немає; число більше 0 = стеля
  shape: sphere               # sphere = куля, cube = куб зі стороною 2*сила+1 (3D: X, Y, Z)
  pierce-water: true          # true = вибух знищує і воду/лаву (пробиває водяний захист)
  break-obsidian: true        # true = обсидіан та інші міцні блоки руйнуються, false = лишаються (бедрок не руйнується ніколи)
  orient: true                # true = осі куба/еліпсоїда прив'язані до вектора погляду того, хто поставив TNT (depth - уздовж погляду)
  scale:                      # множники сили по локальних осях (1 = звичайна куля/куб); width - вправо, height - вгору, depth - вперед
    width: 1.0
    height: 1.0
    depth: 1.0
  forward-shift: 0.0          # зсув центру вибуху вздовж погляду в частках сили (0.5 = центр на пів-радіусі попереду), працює з orient
  obsidian-durability: 1      # скільки вибухів витримує обсидіан/міцні блоки (1 = руйнується одразу, 3 = знімається по 1 за вибух)
  damage-max: 60              # шкода в центрі вибуху (0 = без шкоди сутностям)
  damage-min: 4               # мінімальна шкода на краю
  damage-radius: 0            # радіус шкоди сутностям (0 = дорівнює силі, але не більше 160)
  blast-ms-per-tick: 25       # скільки мс за тік можна витрачати на руйнування (менше = менше лагів, довше вибух)

# Талісмани і сфери
passive:
  slots: hotbar               # hotbar = діють з усього хотбару + ліва рука, offhand = тільки ліва рука
                              # однакові ефекти з кількох предметів НЕ стакаються: береться найвищий рівень

# Кулдауни активних здібностей (секунди, відлік показується в ActionBar; 0 = без кулдауну)
cooldowns:
  lightning: 3.0
  activate: 30.0              # ПКМ талісманом/сферою: посилення ефектів

# Активація предмета (ПКМ)
abilities:
  activate-seconds: 10        # тривалість посилених ефектів
  activate-bonus-levels: 1    # на скільки рівнів вище ефекти предмета

# Книги зачарувань (накладання: книга на курсор і клік по предмету, або ковадло: предмет + книга)
books:
  success-chance: 100         # базовий шанс успіху, %
  level-penalty: 0            # на скільки % падає шанс за кожен рівень вище I
  destroy-on-fail: true       # при невдачі книга зникає (false = лишається)
  break-chance: 0             # при невдачі шанс (%), що предмет зламається
  max-level: 0                # загальна стеля рівня кастомних книг, 0 = лише ліміти самих зачарувань

# Безпека
security:
  click-delay-ms: 120         # мінімальна пауза між кліками в меню/по книзі (захист від швидкого кліку), 0 = вимкнено
  enforce-signature: false    # true = видаляти кастомні предмети без підпису (після того, як усі старі предмети перевидано)
  block-crafting: true        # заборонити кастомні предмети (з forge_uid) у верстаку
  dupe-scan: true             # раз на 5 с шукає однакові forge_uid у інвентарях і видаляє копії
